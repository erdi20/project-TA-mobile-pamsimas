<template>
  <div class="page" data-name="penanganan" style="background: #F3F8FB">
    <a href="#" class="link" @click="${kembaliKeHome}" style="position: absolute; top: 40px; left: 16px; z-index: 999; background: #1B365D; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #FFFFFF; box-shadow: 0 6px 18px rgba(27, 54, 93, 0.25); border: 2px solid #60C1E5">
      <i class="icon f7-icons size-20">arrow_left</i>
    </a>

    <div class="page-content" style="padding: 0; height: 100vh; position: relative">
      <div id="map-penanganan" style="width: 100%; height: 100%; z-index: 1"></div>

      <div style="position: absolute; bottom: 28px; left: 16px; right: 16px; z-index: 10; border-radius: 22px; background: #FFFFFF; padding: 20px; box-shadow: 0 10px 30px rgba(27, 54, 93, 0.18); border: 1.5px solid rgba(160, 224, 239, 0.85)">
        <div style="display: flex; align-items: center; margin-bottom: 16px">
          <div style="width: 50px; height: 50px; background: rgba(160, 224, 239, 0.45); border: 1.5px solid #60C1E5; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-right: 14px; flex-shrink: 0">
            <i class="icon f7-icons size-26" style="color: #005A9C">placemark_fill</i>
          </div>
          <div style="flex: 1; overflow: hidden">
            <div class="font-weight-bold size-11" style="color: #005A9C; text-transform: uppercase; letter-spacing: 0.6px">Tujuan Penanganan</div>
            <div class="font-weight-bold size-18" id="label-kategori" style="color: #1B365D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">...</div>
            <div class="size-13 margin-top-xs" id="label-lokasi" style="color: #5A7188; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Mencari lokasi...</div>
          </div>
        </div>
        <button class="button button-fill button-large pamsimas-btn-primary popup-open" data-popup="#popup-form-tugas" style="font-size: 16px; width: 100%; height: 52px">Form Pekerjaan</button>
      </div>
    </div>

    <!-- POPUP FORM -->
    <div class="popup" id="popup-form-tugas" style="background: #F3F8FB">
      <div class="view">
        <div class="page" style="background: #F3F8FB">
          <div class="navbar" style="background: #1B365D; box-shadow: 0 2px 12px rgba(27, 54, 93, 0.15)">
            <div class="navbar-bg" style="background: #1B365D"></div>
            <div class="navbar-inner">
              <div class="title" style="font-weight: 800; color: #FFFFFF">Data Progres Pekerjaan</div>
              <div class="right">
                <a href="#" class="link popup-close" style="color: #A0E0EF"><i class="icon f7-icons size-24">multiply_circle_fill</i></a>
              </div>
            </div>
          </div>

          <div class="page-content padding-bottom-large" style="background: #F3F8FB">
            <div class="pamsimas-card margin-top margin-horizontal">
              <div class="card-content card-content-padding" style="padding: 16px">
                <div class="font-weight-700 size-14 margin-bottom-half" style="display: flex; justify-content: space-between; align-items: center; color: #1B365D">
                  Foto Laporan Pelapor:
                  <span class="size-12 font-weight-700" style="color: #005A9C"><i class="icon f7-icons size-14">zoom_in</i> Perbesar</span>
                </div>
                <img id="foto-pelapor" src="" @click="${lihatFotoPelapor}" style="width: 100%; height: 180px; object-fit: cover; border-radius: 14px; background: #F3F8FB; border: 1.5px solid #A0E0EF; cursor: zoom-in" />
                <div class="margin-top size-13 font-italic" style="background: #F3F8FB; color: #5A7188; padding: 12px; border-radius: 12px; border-left: 3.5px solid #005A9C">"<span id="teks-deskripsi"></span>"</div>
              </div>
            </div>

            <div class="block-title font-weight-bold margin-top" style="color: #1B365D">Bukti Pengerjaan</div>
            <div class="block margin-bottom">
              <div class="grid-kamera">
                <div class="kotak-kamera">
                  <div class="isi-kamera" @click="${() => interaksiKamera('foto0')}">
                    <i id="icon-foto0" class="icon f7-icons size-28" style="color: #60C1E5">camera_viewfinder</i>
                    <div id="label-foto0" class="size-12 font-weight-800 margin-top-xs" style="color: #005A9C">0%</div>
                    <img id="preview-foto0" src="" style="width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; display: none" />
                  </div>
                  <a href="#" id="hapus-foto0" @click="${() => hapusFoto('foto0')}" style="position: absolute; top: 6px; right: 6px; background: #E04F5F; width: 28px; height: 28px; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 10; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25)">
                    <i class="icon f7-icons size-14 color-white">trash</i>
                  </a>
                </div>

                <div class="kotak-kamera">
                  <div class="isi-kamera" @click="${() => interaksiKamera('foto50')}">
                    <i id="icon-foto50" class="icon f7-icons size-28" style="color: #60C1E5">camera_viewfinder</i>
                    <div id="label-foto50" class="size-12 font-weight-800 margin-top-xs" style="color: #005A9C">50%</div>
                    <img id="preview-foto50" src="" style="width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; display: none" />
                  </div>
                  <a href="#" id="hapus-foto50" @click="${() => hapusFoto('foto50')}" style="position: absolute; top: 6px; right: 6px; background: #E04F5F; width: 28px; height: 28px; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 10; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25)">
                    <i class="icon f7-icons size-14 color-white">trash</i>
                  </a>
                </div>

                <div class="kotak-kamera">
                  <div class="isi-kamera" @click="${() => interaksiKamera('foto100')}">
                    <i id="icon-foto100" class="icon f7-icons size-28" style="color: #60C1E5">camera_viewfinder</i>
                    <div id="label-foto100" class="size-12 font-weight-800 margin-top-xs" style="color: #005A9C">100%</div>
                    <img id="preview-foto100" src="" style="width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; display: none" />
                  </div>
                  <a href="#" id="hapus-foto100" @click="${() => hapusFoto('foto100')}" style="position: absolute; top: 6px; right: 6px; background: #E04F5F; width: 28px; height: 28px; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 10; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25)">
                    <i class="icon f7-icons size-14 color-white">trash</i>
                  </a>
                </div>
              </div>
            </div>

            <div class="block-title font-weight-bold" style="color: #1B365D">Catatan Penanganan</div>
            <div class="block margin-top-half margin-bottom">
              <textarea id="catatan-petugas" class="pamsimas-input" placeholder="Ketik rincian perbaikan..." style="min-height: 110px; background: #FFFFFF"></textarea>
            </div>

            <div class="block margin-top-large padding-bottom-large">
              <button id="btn-kirim" class="button button-fill button-large color-blue pamsimas-btn-primary" style="height: 54px; font-size: 16px" @click="${kirimHasil}">Simpan Progres</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
  export default (props, { $f7, $on }) => {
    let dataLaporan = null;
    let fotoBase64 = { foto0: "", foto50: "", foto100: "" };
    let petaLeaflet = null;
    let markerPetugas = null;
    let latTarget = -7.55;
    let lngTarget = 112.23;

    $on("pageInit", () => {
      const dataString = localStorage.getItem("laporan_aktif");
      if (!dataString) return;

      dataLaporan = JSON.parse(dataString);
      latTarget = parseFloat(dataLaporan.latitude) || -7.55;
      lngTarget = parseFloat(dataLaporan.longitude) || 112.23;

      document.getElementById("label-kategori").innerText = dataLaporan.jenis;
      document.getElementById("label-lokasi").innerText = `Pelapor: ${dataLaporan.nama} - ${dataLaporan.no_telp || ""}`;
      document.getElementById("teks-deskripsi").innerText = dataLaporan.keterangan;
      document.getElementById("foto-pelapor").src = `${BASE_URL}/img_laporan/${dataLaporan.foto}`;

      memuatDrafProgress();

      document.getElementById("catatan-petugas").addEventListener("input", (e) => {
        localStorage.setItem(`draf_catatan_${dataLaporan.id}`, e.target.value);
        cekStatusTombolKirim();
      });

      setTimeout(initPeta, 150);
      document.addEventListener("backbutton", onBackKeyDown, false);
      window.addEventListener("gpsUpdated", onGpsUpdated);
    });

    $on("pageBeforeRemove", () => {
      document.removeEventListener("backbutton", onBackKeyDown, false);
      window.removeEventListener("gpsUpdated", onGpsUpdated);
      if (petaLeaflet) {
        petaLeaflet.remove();
        petaLeaflet = null;
      }
    });

    const onBackKeyDown = (e) => {
      e.preventDefault();
      kembaliKeHome();
    };

    const kembaliKeHome = () => {
      $f7.views.main.router.back("/home/", { force: true });
    };

    const bukaPreviewFoto = (src) => {
      $f7.photoBrowser.create({ photos: [src], theme: "dark", toolbar: false, navbar: true, backLinkText: "Tutup" }).open();
    };

    const lihatFotoPelapor = () => bukaPreviewFoto(`${BASE_URL}/img_laporan/${dataLaporan.foto}`);

    const memuatDrafProgress = () => {
      const drafFoto = localStorage.getItem(`draf_foto_${dataLaporan.id}`);

      if (drafFoto !== null) {
        fotoBase64 = JSON.parse(drafFoto);
      } else if (dataLaporan.foto_perbaikan) {
        try {
          const listFotoServer = JSON.parse(dataLaporan.foto_perbaikan);
          const cacheBuster = `?t=${Date.now()}`;

          if (Array.isArray(listFotoServer)) {
            listFotoServer.forEach((namaFile) => {
              const urlLengkap = `${BASE_URL}/img_penanganan/${namaFile}${cacheBuster}`;
              if (namaFile.includes("_0.jpg")) fotoBase64.foto0 = urlLengkap;
              else if (namaFile.includes("_50.jpg")) fotoBase64.foto50 = urlLengkap;
              else if (namaFile.includes("_100.jpg")) fotoBase64.foto100 = urlLengkap;
            });
            localStorage.setItem(`draf_foto_${dataLaporan.id}`, JSON.stringify(fotoBase64));
          }
        } catch (e) {
          console.warn("Gagal membaca foto dari server:", e);
        }
      }

      ["foto0", "foto50", "foto100"].forEach((key) => {
        if (fotoBase64[key]) updateUIKamera(key, fotoBase64[key]);
      });

      const drafCatatan = localStorage.getItem(`draf_catatan_${dataLaporan.id}`);
      if (drafCatatan !== null) {
        document.getElementById("catatan-petugas").value = drafCatatan;
      } else if (dataLaporan.catatan_penanganan) {
        document.getElementById("catatan-petugas").value = dataLaporan.catatan_penanganan;
        localStorage.setItem(`draf_catatan_${dataLaporan.id}`, dataLaporan.catatan_penanganan);
      }

      cekStatusTombolKirim();
    };

    const cekStatusTombolKirim = () => {
      const is3Foto = Boolean(fotoBase64.foto0 && fotoBase64.foto50 && fotoBase64.foto100);
      const btn = document.getElementById("btn-kirim");

      btn.innerText = is3Foto ? "Kirim & Selesaikan" : "Simpan Progres";
      btn.classList.toggle("color-green", is3Foto);
      btn.classList.toggle("color-blue", !is3Foto);
    };

    const updateUIKamera = (jenisFoto, imageSrc) => {
      if (!imageSrc) return hapusFoto(jenisFoto);

      const preview = document.getElementById(`preview-${jenisFoto}`);
      preview.src = imageSrc;
      preview.style.display = "block";
      document.getElementById(`icon-${jenisFoto}`).style.display = "none";
      document.getElementById(`label-${jenisFoto}`).style.display = "none";
      document.getElementById(`hapus-${jenisFoto}`).style.display = "flex";
      preview.closest(".kotak-kamera").style.border = "2.5px solid #005A9C";
      cekStatusTombolKirim();
    };

    const hapusFoto = (jenisFoto) => {
      fotoBase64[jenisFoto] = "";
      localStorage.setItem(`draf_foto_${dataLaporan.id}`, JSON.stringify(fotoBase64));

      const preview = document.getElementById(`preview-${jenisFoto}`);
      preview.src = "";
      preview.style.display = "none";
      document.getElementById(`icon-${jenisFoto}`).style.display = "block";
      document.getElementById(`label-${jenisFoto}`).style.display = "block";
      document.getElementById(`hapus-${jenisFoto}`).style.display = "none";
      preview.closest(".kotak-kamera").style.border = "2px dashed #60C1E5";
      cekStatusTombolKirim();
    };

    const interaksiKamera = (jenisFoto) => {
      if (fotoBase64[jenisFoto]) {
        return bukaPreviewFoto(fotoBase64[jenisFoto]);
      }

      if (jenisFoto === "foto50" && !fotoBase64.foto0) {
        return $f7.dialog.alert("Ambil foto progres 0% terlebih dahulu!", "Urutan Progres");
      }
      if (jenisFoto === "foto100" && !fotoBase64.foto0) {
        return $f7.dialog.alert("Ambil foto progres 0% terlebih dahulu!", "Urutan Progres");
      }
      if (jenisFoto === "foto100" && !fotoBase64.foto50) {
        return $f7.dialog.alert("Ambil foto progres 50% terlebih dahulu!", "Urutan Progres");
      }

      bukaKamera(jenisFoto);
    };

    const updateMarkerPetugas = (coords) => {
      if (!coords || !petaLeaflet) return;

      if (!markerPetugas) {
        const iconPetugas = L.divIcon({ className: "gps-marker-petugas", iconSize: [20, 20], iconAnchor: [10, 10] });
        markerPetugas = L.marker(coords, { icon: iconPetugas }).addTo(petaLeaflet);

        L.Routing.control({
          waypoints: [L.latLng(coords[0], coords[1]), L.latLng(latTarget, lngTarget)],
          routeWhileDragging: false,
          addWaypoints: false,
          show: false,
          createMarker: () => null,
        }).addTo(petaLeaflet);

        petaLeaflet.fitBounds(L.latLngBounds([coords, [latTarget, lngTarget]]), { padding: [50, 50] });
      } else {
        markerPetugas.setLatLng(coords);
      }
    };

    const onGpsUpdated = (e) => updateMarkerPetugas(e.detail);

    const initPeta = () => {
      petaLeaflet = L.map("map-penanganan", { zoomControl: false }).setView([latTarget, lngTarget], 15);
      L.tileLayer("https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}", { maxZoom: 20, subdomains: ["mt0", "mt1", "mt2", "mt3"] }).addTo(petaLeaflet);

      const targetIcon = L.icon({
        iconUrl: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png",
        shadowUrl: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png",
        iconSize: [25, 41],
        iconAnchor: [12, 41],
      });
      L.marker([latTarget, lngTarget], { icon: targetIcon }).addTo(petaLeaflet).bindPopup("Lokasi Tujuan").openPopup();

      if (window.gpsPetugas) updateMarkerPetugas(window.gpsPetugas);
    };

    const formatDMS = (lat, lng) => {
      const convert = (val) => {
        const abs = Math.abs(val);
        const d = Math.floor(abs);
        const m = Math.floor((abs - d) * 60);
        const s = ((abs - d - m / 60) * 3600).toFixed(3);
        return `${d}°${m}'${s}"`;
      };
      return `${convert(lat)}${lat >= 0 ? "N" : "S"} ${convert(lng)}${lng >= 0 ? "E" : "W"}`;
    };

    const pasangWatermark = (base64Ori) => {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const cvs = document.createElement("canvas");
          const ctx = cvs.getContext("2d");
          cvs.width = img.width;
          cvs.height = img.height;
          ctx.drawImage(img, 0, 0);

          const tgl = new Date().toLocaleString("id-ID", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" });
          const nama = localStorage.getItem("petugas_nama") || "PETUGAS LAPANGAN";
          const kordinat = window.gpsPetugas ? formatDMS(window.gpsPetugas[0], window.gpsPetugas[1]) : "Koordinat Belum Terkunci";

          const fs = cvs.width * 0.032;
          ctx.fillStyle = "rgba(0,0,0,0.5)";
          ctx.fillRect(0, cvs.height - fs * 5.5, cvs.width, fs * 5.5);

          ctx.font = `normal ${fs}px sans-serif`;
          ctx.fillStyle = "#ffffff";
          ctx.fillText(tgl, fs, cvs.height - fs * 3.8);
          ctx.fillText(kordinat, fs, cvs.height - fs * 2.3);
          ctx.fillText(`${dataLaporan.id} - ${nama}`, fs, cvs.height - fs * 0.8);

          resolve(cvs.toDataURL("image/jpeg", 0.7));
        };
        img.src = base64Ori;
      });
    };

    const bukaKamera = (jenisFoto) => {
      if (!navigator.camera) return $f7.dialog.alert("Plugin kamera tidak terdeteksi.", "Error");

      navigator.camera.getPicture(
        (imageData) => {
          const base64Ori = imageData.startsWith("data:image") ? imageData : `data:image/jpeg;base64,${imageData}`;
          pasangWatermark(base64Ori).then((base64Watermark) => {
            fotoBase64[jenisFoto] = base64Watermark;
            localStorage.setItem(`draf_foto_${dataLaporan.id}`, JSON.stringify(fotoBase64));
            updateUIKamera(jenisFoto, base64Watermark);
          });
        },
        (err) => console.log("Kamera:", err),
        { quality: 60, destinationType: Camera.DestinationType.DATA_URL, sourceType: Camera.PictureSourceType.CAMERA, encodingType: Camera.EncodingType.JPEG, targetWidth: 800, targetHeight: 800, correctOrientation: true, saveToPhotoAlbum: false },
      );
    };

    const kirimHasil = () => {
      const catatan = document.getElementById("catatan-petugas").value.trim();
      const id_petugas = localStorage.getItem("petugas_id");
      const is3Foto = Boolean(fotoBase64.foto0 && fotoBase64.foto50 && fotoBase64.foto100);

      if (!fotoBase64.foto0) {
        if (!fotoBase64.foto50 && !fotoBase64.foto100) {
          return $f7.dialog.alert("Minimal foto progres 0% harus diambil untuk disimpan!", "Validasi");
        }
        return $f7.dialog.alert("Foto progres harus berurutan! Lengkapi foto 0% terlebih dahulu.", "Validasi Urutan");
      }

      if (fotoBase64.foto100 && !fotoBase64.foto50) {
        return $f7.dialog.alert("Foto progres harus berurutan! Lengkapi foto 50% terlebih dahulu sebelum mengirim 100%.", "Validasi Urutan");
      }

      if (is3Foto && !catatan) {
        return $f7.dialog.alert("Semua foto progres (0%, 50%, 100%) sudah lengkap. Isi catatan penanganan terlebih dahulu untuk mengirim ke Admin!", "Catatan Wajib Diisi");
      }

      if (!window.gpsPetugas) {
        return $f7.dialog.alert("Data lokasi GPS belum terbaca. Tunggu sebentar di area terbuka lalu coba lagi.", "Lokasi Belum Siap");
      }

      const pesanKonfirmasi = is3Foto ? "Kirim data perbaikan ke Admin? Data tidak dapat diubah setelah dikirim." : "Simpan progres pekerjaan ke Server saat ini?";

      $f7.dialog.confirm(pesanKonfirmasi, "Konfirmasi", () => {
        $f7.dialog.preloader("Mengirim ke Server...");

        fetch(`${API_URL}/submit_penanganan`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id_laporan: dataLaporan.id,
            id_petugas: id_petugas,
            catatan: catatan,
            foto0: fotoBase64.foto0,
            foto50: fotoBase64.foto50,
            foto100: fotoBase64.foto100,
            latitude: window.gpsPetugas[0],
            longitude: window.gpsPetugas[1],
          }),
        })
          .then((res) => res.json())
          .then((res) => {
            $f7.dialog.close();
            if (res.status) {
              if (res.is_complete) {
                localStorage.removeItem(`draf_foto_${dataLaporan.id}`);
                localStorage.removeItem(`draf_catatan_${dataLaporan.id}`);
                $f7.dialog.alert(res.pesan, "Berhasil Selesai", kembaliKeHome);
              } else {
                $f7.dialog.alert(res.pesan, "Progres Tersimpan");
              }
            } else {
              $f7.dialog.alert(res.pesan, "Gagal");
            }
          })
          .catch(() => {
            $f7.dialog.close();
            $f7.dialog.alert("Koneksi bermasalah. Pastikan sinyal internet stabil.", "Error Jaringan");
          });
      });
    };

    return $render;
  };
</script>
