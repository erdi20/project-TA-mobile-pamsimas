<template>
  <div class="page" data-name="login" style="background: #F3F8FB">
    <div class="page-content login-screen-content" style="padding: 0; min-height: 100vh; background: #F3F8FB; display: flex; flex-direction: column">
      <!-- HEADER MELENGKUNG NAVY -->
      <div style="background: linear-gradient(145deg, #1B365D 0%, #005A9C 100%); padding: 54px 24px 76px; border-bottom-left-radius: 34px; border-bottom-right-radius: 34px; text-align: center; box-shadow: 0 10px 28px rgba(27, 54, 93, 0.22)">
        <div style="width: 84px; height: 84px; background: rgba(160, 224, 239, 0.16); border: 2px solid #60C1E5; border-radius: 26px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15)">
          <i class="icon f7-icons size-42" style="color: #A0E0EF">drop_fill</i>
        </div>
        <h1 style="margin: 0; font-size: 28px; font-weight: 800; color: #FFFFFF; letter-spacing: 1px">PAMSIMAS</h1>
        <div style="display: inline-block; margin-top: 8px; background: rgba(96, 193, 229, 0.22); color: #A0E0EF; font-size: 12px; font-weight: 700; padding: 5px 14px; border-radius: 20px; border: 1px solid rgba(160, 224, 239, 0.35)">
          Portal Petugas Lapangan
        </div>
      </div>

      <!-- KARTU FORM LOGIN -->
      <div style="padding: 0 22px 30px; margin-top: -46px; flex: 1">
        <div class="pamsimas-card" style="border-radius: 24px; margin: 0">
          <div class="card-content card-content-padding" style="padding: 30px 24px">
            <form id="form-login" @submit="${(e) => e.preventDefault()}">
              <div style="margin-bottom: 22px">
                <div class="size-12 font-weight-700 margin-bottom-half" style="color: #1B365D; text-transform: uppercase; letter-spacing: 0.6px">Username</div>
                <input type="text" id="input-username" class="pamsimas-input" placeholder="Ketik username Anda..." required />
              </div>

              <div style="margin-bottom: 34px; position: relative">
                <div class="size-12 font-weight-700 margin-bottom-half" style="color: #1B365D; text-transform: uppercase; letter-spacing: 0.6px">Password</div>
                <div style="position: relative">
                  <input type="password" id="input-password" class="pamsimas-input" placeholder="Ketik kata sandi..." required style="padding-right: 46px" />
                  <a href="#" class="link" @click="${togglePassword}" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: #005A9C">
                    <i class="icon f7-icons size-22" id="icon-toggle-password">eye_slash_fill</i>
                  </a>
                </div>
              </div>

              <button type="button" class="button button-fill button-large pamsimas-btn-primary" @click="${prosesLogin}" style="height: 54px; font-size: 16px">Masuk Sistem</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
  export default (props, { $f7 }) => {
    const togglePassword = () => {
      const input = document.getElementById("input-password");
      const icon = document.getElementById("icon-toggle-password");
      const isHidden = input.type === "password";

      input.type = isHidden ? "text" : "password";
      icon.innerText = isHidden ? "eye_fill" : "eye_slash_fill";
      icon.classList.toggle("color-blue", isHidden);
    };

    const prosesLogin = () => {
      const username = document.getElementById("input-username").value.trim();
      const password = document.getElementById("input-password").value.trim();

      if (!username || !password) {
        return $f7.dialog.alert("Username dan Password wajib diisi!", "Validasi");
      }

      $f7.dialog.preloader("Otentikasi Akun...");

      fetch(`${API_URL}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      })
        .then((res) => res.json())
        .then((res) => {
          $f7.dialog.close();
          if (res.status) {
            localStorage.setItem("petugas_login", "true");
            localStorage.setItem("petugas_id", res.data.id_petugas);
            localStorage.setItem("petugas_nama", res.data.nama);
            $f7.views.main.router.navigate("/home/", { clearPreviousHistory: true });
          } else {
            $f7.dialog.alert(res.pesan, "Gagal Login");
          }
        })
        .catch(() => {
          $f7.dialog.close();
          $f7.dialog.alert("Koneksi bermasalah. Pastikan sinyal internet stabil.", "Error Jaringan");
        });
    };

    return $render;
  };
</script>
