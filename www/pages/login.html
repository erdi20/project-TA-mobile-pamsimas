<template>
  <div class="page bg-color-white" data-name="login">
    <!-- WADAH UTAMA: Menggunakan min-height 100vh dan flex column untuk distribusi ruang -->
    <div class="page-content login-screen-content" style="display: flex; flex-direction: column; min-height: 100vh; padding: 40px 24px 30px; background: #faf9f9">
      <!-- KONTEN TENGAH (Mendominasi ruang fleksibel) -->
      <div style="flex: 1; display: flex; flex-direction: column; justify-content: center">
        <!-- HEADER / LOGO APP -->
        <!-- Jarak ke form diubah menjadi 48px agar tidak mepet -->
        <div class="text-align-center" style="margin-bottom: 48px">
          <div class="elevation-2" style="width: 88px; height: 88px; background: #2563eb; border-radius: 28px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; transform: rotate(10deg)">
            <div style="transform: rotate(-10deg)">
              <i class="icon f7-icons size-44 color-white">drop_fill</i>
            </div>
          </div>
          <h1 style="margin: 0; font-size: 32px; font-weight: 800; color: #1f2937; letter-spacing: 1px">PAMSIMAS</h1>
          <p style="margin: 8px 0 0; color: #6b7280; font-size: 15px; font-weight: 500">Portal Petugas Lapangan</p>
        </div>

        <!-- KARTU FORM LOGIN -->
        <div class="card elevation-2" style="border-radius: 24px; margin: 0; background: #ffffff; border: 1px solid #f3f4f6">
          <!-- Padding internal form diperbesar jadi 32px -->
          <div class="card-content card-content-padding" style="padding: 32px 24px">
            <form id="form-login" @submit="${(e) => e.preventDefault()}">
              <!-- INPUT USERNAME -->
              <!-- Margin bawah 24px -->
              <div style="margin-bottom: 24px">
                <div class="text-color-gray size-12 font-weight-700 margin-bottom-half" style="text-transform: uppercase; letter-spacing: 0.5px">Username</div>
                <input type="text" id="input-username" placeholder="Ketik username Anda..." required style="width: 100%; font-size: 15px; font-weight: 500; color: #1f2937; background: #ffffff; border: 1.5px solid #e5e7eb; border-radius: 14px; padding: 16px; box-sizing: border-box; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02); transition: border-color 0.2s" />
              </div>

              <!-- INPUT PASSWORD -->
              <!-- Margin bawah diperbesar menjadi 40px sebelum tombol -->
              <div style="margin-bottom: 40px; position: relative">
                <div class="text-color-gray size-12 font-weight-700 margin-bottom-half" style="text-transform: uppercase; letter-spacing: 0.5px">Password</div>
                <div style="position: relative">
                  <input
                    type="password"
                    id="input-password"
                    placeholder="Ketik kata sandi..."
                    required
                    style="width: 100%; font-size: 15px; font-weight: 500; color: #1f2937; background: #ffffff; border: 1.5px solid #e5e7eb; border-radius: 14px; padding: 16px; padding-right: 45px; box-sizing: border-box; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02); transition: border-color 0.2s"
                  />
                  <a href="#" class="link text-color-gray" @click="${togglePassword}" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; display: flex; align-items: center; justify-content: center">
                    <i class="icon f7-icons size-22" id="icon-toggle-password">eye_slash_fill</i>
                  </a>
                </div>
              </div>

              <!-- TOMBOL LOGIN -->
              <!-- Tombol dibuat sedikit lebih tinggi (56px) agar proporsional -->
              <button type="button" class="button button-fill button-large color-blue elevation-3" @click="${prosesLogin}" style="border-radius: 14px; font-weight: 700; height: 56px; font-size: 16px">Masuk Sistem</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
  export default (props, { $f7, $on }) => {
    const togglePassword = () => {
      const input = document.getElementById("input-password");
      const icon = document.getElementById("icon-toggle-password");

      if (input.type === "password") {
        input.type = "text";
        icon.innerText = "eye_fill";
        icon.classList.add("color-blue");
      } else {
        input.type = "password";
        icon.innerText = "eye_slash_fill";
        icon.classList.remove("color-blue");
      }
    };

    const prosesLogin = () => {
      const username = document.getElementById("input-username").value.trim();
      const password = document.getElementById("input-password").value.trim();

      if (!username || !password) {
        return $f7.dialog.alert("Username dan Password wajib diisi!", "Validasi");
      }

      $f7.dialog.preloader("Otentikasi Akun...");

      fetch("https://webinformasi.full.diskon.cloud/api/apipetugas/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      })
        .then((res) => res.json())
        .then((res) => {
          $f7.dialog.close();

          if (res.status) {
            localStorage.setItem("petugas_login", "true");
            localStorage.setItem("petugas_id", res.data.id_petugas);
            localStorage.setItem("petugas_nama", res.data.nama);

            $f7.views.main.router.navigate("/home/", { clearPreviousHistory: true });
          } else {
            $f7.dialog.alert(res.pesan, "Gagal Login");
          }
        })
        .catch(() => {
          $f7.dialog.close();
          $f7.dialog.alert("Koneksi bermasalah. Pastikan sinyal internet stabil.", "Error Jaringan");
        });
    };

    return $render;
  };
</script>
