<template>
  <div class="page page-with-subnavbar" data-name="home" style="background-color: #F3F8FB">
    <!-- NAVBAR ATAS NAVY -->
    <div class="navbar" style="background: #1B365D; box-shadow: 0 2px 12px rgba(27, 54, 93, 0.15)">
      <div class="navbar-bg" style="background: #1B365D"></div>
      <div class="navbar-inner sliding" style="padding: 0 16px">
        <div class="left" style="display: flex; align-items: center; gap: 10px">
          <div style="width: 34px; height: 34px; background: rgba(96, 193, 229, 0.2); border: 1.5px solid #60C1E5; border-radius: 10px; display: flex; align-items: center; justify-content: center">
            <i class="icon f7-icons size-18" style="color: #A0E0EF">drop_fill</i>
          </div>
          <div class="title" style="font-weight: 800; font-size: 19px; color: #FFFFFF; letter-spacing: 0.5px; margin: 0">PAMSIMAS</div>
        </div>
        <div class="right">
          <a href="#" class="link" @click="${konfirmasiLogout}" style="background: rgba(255, 255, 255, 0.12); padding: 6px 13px; border-radius: 20px; display: flex; align-items: center; gap: 6px; border: 1px solid rgba(160, 224, 239, 0.35)">
            <i class="icon f7-icons size-15" style="color: #A0E0EF">square_arrow_right</i>
            <span style="font-size: 12px; font-weight: 700; color: #FFFFFF">Keluar</span>
          </a>
        </div>

        <div class="subnavbar pamsimas-subnavbar">
          <div class="subnavbar-inner" style="justify-content: flex-start; gap: 10px; padding: 0 16px">
            <a href="#tab-tugas" class="tab-link tab-link-active">Tugas <span class="badge" id="badge-tugas" style="display: none; background: #A0E0EF; color: #1B365D; font-weight: 800; border-radius: 10px; margin-left: 4px">0</span></a>
            <a href="#tab-onprogress" class="tab-link">On-progress <span class="badge" id="badge-onprogress" style="display: none; background: #A0E0EF; color: #1B365D; font-weight: 800; border-radius: 10px; margin-left: 4px">0</span></a>
            <a href="#tab-riwayat" class="tab-link">Riwayat</a>
          </div>
        </div>
      </div>
    </div>

    <!-- BOTTOM TOOLBAR -->
    <div class="toolbar tabbar tabbar-icons toolbar-bottom pamsimas-tabbar">
      <div class="toolbar-inner" style="overflow: visible !important">
        <a href="#tab-tugas" class="tab-link tab-link-active" @click="${pindahTabBeranda}">
          <i class="icon f7-icons" style="font-size: 24px">house_fill</i>
          <!-- <span class="tabbar-label" style="font-size: 11px; font-weight: 700; margin-top: 2px">Beranda</span> -->
        </a>

        <a href="#" class="link pamsimas-fab-refresh" @click="${refreshData}">
          <i class="icon f7-icons" style="font-size: 24px; color: #FFFFFF">arrow_clockwise</i>
          <!-- <span class="tabbar-label" style="display: block; font-size: 10px; font-weight: 600; color: #A0E0EF; margin-top: 1px">Segarkan</span> -->
        </a>

        <a href="#tab-profil" class="tab-link" @click="${muatProfil}">
          <i class="icon f7-icons" style="font-size: 24px">person_fill</i>
          <!-- <span class="tabbar-label" style="font-size: 11px; font-weight: 700; margin-top: 2px">Profil</span> -->
        </a>
      </div>
    </div>

    <!-- KONTEN TABS -->
    <div class="tabs">
      <div id="tab-tugas" class="page-content tab tab-active" style="background: #F3F8FB">
        <div id="loading-tugas" class="text-align-center padding-top-large"><div class="preloader color-blue"></div></div>
        <div id="list-tugas" class="padding-horizontal padding-top"></div>
      </div>

      <div id="tab-onprogress" class="page-content tab" style="background: #F3F8FB">
        <div id="list-onprogress" class="padding-horizontal padding-top"></div>
      </div>

      <div id="tab-riwayat" class="page-content tab" style="background: #F3F8FB">
        <div id="list-riwayat" class="padding-horizontal padding-top"></div>
      </div>

      <div id="tab-profil" class="page-content tab" style="background: #F3F8FB">
        <div class="padding">
          <div class="pamsimas-card" style="margin: 0; overflow: hidden">
            <div style="height: 90px; background: linear-gradient(135deg, #1B365D 0%, #005A9C 65%, #60C1E5 100%)"></div>
            <div class="card-content card-content-padding text-align-center" style="padding: 0 24px 26px">
              <div style="width: 84px; height: 84px; background: #F3F8FB; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: -42px auto 14px; border: 4px solid #FFFFFF; box-shadow: 0 6px 16px rgba(27, 54, 93, 0.16)">
                <i class="icon f7-icons size-42" style="color: #005A9C">person_alt_circle_fill</i>
              </div>
              <h2 id="profil-nama" style="margin: 0; font-size: 20px; font-weight: 800; color: #1B365D">Memuat...</h2>
              <p id="profil-username" style="margin: 4px 0 18px; font-size: 14px; font-weight: 600; color: #005A9C"></p>

              <div style="background: #F3F8FB; border-radius: 16px; padding: 14px 16px; text-align: left; border: 1px solid rgba(160, 224, 239, 0.85)">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(96, 193, 229, 0.3)">
                  <span style="font-size: 13px; color: #5A7188">Level Akses</span>
                  <span style="font-size: 13px; font-weight: 700; color: #1B365D">Petugas Penanganan</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(96, 193, 229, 0.3)">
                  <span style="font-size: 13px; color: #5A7188">Status Akun</span>
                  <span id="profil-status" style="font-size: 12px; font-weight: 700; color: #0E8A72; background: rgba(14, 138, 114, 0.12); padding: 2px 10px; border-radius: 12px">Aktif</span>
                </div>
                <div style="display: flex; justify-content: space-between">
                  <span style="font-size: 13px; color: #5A7188">Terdaftar</span>
                  <span id="profil-tgl" style="font-size: 13px; font-weight: 700; color: #1B365D">-</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script>
  export default (props, { $f7, $on, $ }) => {
    let daftarTugasSemua = [];
    const idPetugas = localStorage.getItem("petugas_id") || "";

    $on("pageInit", () => {
      muatTugas();
      muatRiwayat();

      const handleKlikKartu = (e) => {
        const card = e.target.closest(".card-laporan-klik");
        if (card) bukaFormPenanganan(card.getAttribute("data-id"));
      };

      document.getElementById("list-tugas")?.addEventListener("click", handleKlikKartu);
      document.getElementById("list-onprogress")?.addEventListener("click", handleKlikKartu);
    });

    const konfirmasiLogout = () => {
      $f7.dialog.confirm("Apakah Anda yakin ingin mengakhiri sesi dan keluar?", "Keluar Akun", () => {
        localStorage.removeItem("petugas_login");
        localStorage.removeItem("petugas_id");
        localStorage.removeItem("petugas_nama");
        $f7.views.main.router.navigate("/login/", { clearPreviousHistory: true, reloadCurrent: true });
      });
    };

    const pindahTabBeranda = () => {
      $(".subnavbar").show();
      $f7.tab.show("#tab-tugas");
    };

    const refreshData = () => {
      $f7.toast.create({ text: "Menyinkronkan data terbaru...", position: "top", closeTimeout: 2000 }).open();
      document.getElementById("list-tugas").innerHTML = "";
      document.getElementById("list-onprogress").innerHTML = "";
      document.getElementById("loading-tugas").style.display = "block";

      muatTugas();
      muatRiwayat();
      if (document.getElementById("tab-profil").classList.contains("tab-active")) muatProfil();
    };

    const muatProfil = () => {
      $(".subnavbar").hide();
      fetch(`${API_URL}/profil/${idPetugas}`)
        .then((res) => res.json())
        .then((res) => {
          if (res.status) {
            const data = res.data;
            document.getElementById("profil-nama").innerText = data.nama;
            document.getElementById("profil-username").innerText = `@${data.username}`;
            document.getElementById("profil-status").innerText = data.status === "Y" ? "Aktif" : "Nonaktif";
            document.getElementById("profil-tgl").innerText = new Date(data.tgl_buat).toLocaleDateString("id-ID", { year: "numeric", month: "long", day: "numeric" });
          }
        });
    };

    const muatTugas = () => {
      fetch(`${API_URL}/tugas/${idPetugas}`)
        .then((res) => res.json())
        .then((res) => {
          document.getElementById("loading-tugas").style.display = "none";

          if (res.status && res.data.length > 0) {
            daftarTugasSemua = res.data;
            const dataTugas = [];
            const dataOnProgress = [];

            res.data.forEach((item) => {
              const punyaDraf = localStorage.getItem(`draf_foto_${item.id}`) || localStorage.getItem(`draf_catatan_${item.id}`);
              if ((item.status === "Ditugaskan" || item.status === "Menunggu") && !punyaDraf) {
                dataTugas.push(item);
              } else {
                dataOnProgress.push(item);
              }
            });

            renderCards(dataTugas, "list-tugas");
            renderCards(dataOnProgress, "list-onprogress");
            updateBadge("badge-tugas", dataTugas.length);
            updateBadge("badge-onprogress", dataOnProgress.length);
          } else {
            tampilKosong("list-tugas", "tray_fill", "Tidak ada laporan");
            tampilKosong("list-onprogress", "tray_fill", "Tidak ada laporan");
            updateBadge("badge-tugas", 0);
            updateBadge("badge-onprogress", 0);
          }
        })
        .catch(() => {
          document.getElementById("loading-tugas").innerHTML = `<div class="block text-align-center margin-top-large"><p style="color: #E04F5F; font-weight: 600;">Koneksi server terputus.</p></div>`;
        });
    };

    const muatRiwayat = () => {
      fetch(`${API_URL}/riwayat/${idPetugas}`)
        .then((res) => res.json())
        .then((res) => {
          res.status && res.data.length > 0 ? renderCardsRiwayat(res.data, "list-riwayat") : tampilKosong("list-riwayat", "clock_fill", "Belum ada riwayat pengerjaan");
        });
    };

    const updateBadge = (id, count) => {
      const badge = document.getElementById(id);
      badge.innerText = count;
      badge.style.display = count > 0 ? "inline-block" : "none";
    };

    const tampilKosong = (targetId, icon, text) => {
      document.getElementById(targetId).innerHTML = `
        <div class="display-flex flex-direction-column align-items-center justify-content-center" style="height: 52vh;">
          <div style="width: 76px; height: 76px; background: rgba(160, 224, 239, 0.35); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 14px;">
            <i class="icon f7-icons" style="font-size: 36px; color: #005A9C;">${icon}</i>
          </div>
          <p style="color: #5A7188; font-size: 14px; font-weight: 600; margin: 0;">${text}</p>
        </div>`;
    };

    const renderCards = (dataArray, targetElementId) => {
      if (dataArray.length === 0) return tampilKosong(targetElementId, "tray_fill", "Tidak ada laporan");

      document.getElementById(targetElementId).innerHTML = dataArray
        .map((item) => {
          const tgl = new Date(item.tanggal).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
          return `
            <div class="pamsimas-card card-laporan-klik" data-id="${item.id}" style="margin: 0 0 14px 0; cursor: pointer;">
              <div class="card-content card-content-padding" style="padding: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                  <span style="font-size: 11px; font-weight: 800; color: #1B365D; background: #A0E0EF; padding: 4px 10px; border-radius: 8px; letter-spacing: 0.3px;">#${item.id}</span>
                  <div style="font-size: 12px; font-weight: 600; color: #005A9C; display: flex; align-items: center; gap: 4px;"><i class="icon f7-icons size-13">calendar</i> ${tgl}</div>
                </div>
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                  <div style="width: 32px; height: 32px; background: rgba(160, 224, 239, 0.3); border: 1px solid #60C1E5; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <i class="icon f7-icons size-15" style="color: #005A9C;">person_fill</i>
                  </div>
                  <div style="font-size: 15px; font-weight: 700; color: #1B365D;">${item.nama || "Tanpa Nama"}</div>
                </div>
                <div style="background: #F3F8FB; padding: 10px 12px; border-radius: 12px; display: flex; align-items: flex-start; gap: 8px; border-left: 3.5px solid #60C1E5;">
                  <i class="icon f7-icons size-15" style="color: #005A9C; margin-top: 2px; flex-shrink: 0;">doc_text_fill</i>
                  <div style="font-size: 13px; color: #5A7188; line-height: 1.4;">${item.keterangan || "-"}</div>
                </div>
              </div>
            </div>`;
        })
        .join("");
    };

    const renderCardsRiwayat = (dataArray, targetElementId) => {
      document.getElementById(targetElementId).innerHTML = dataArray
        .map((item) => {
          const isSelesai = item.status === "Selesai";
          const colorTheme = isSelesai ? "#0E8A72" : "#E04F5F";
          const badgeBg = isSelesai ? "rgba(14, 138, 114, 0.12)" : "rgba(224, 79, 95, 0.12)";
          return `
            <div class="pamsimas-card" style="margin: 0 0 14px 0;">
              <div class="card-content card-content-padding" style="padding: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                  <span style="font-size: 11px; font-weight: 800; color: #1B365D; background: #A0E0EF; padding: 4px 10px; border-radius: 8px;">#${item.id}</span>
                  <div style="font-size: 12px; font-weight: 700; color: ${colorTheme}; background: ${badgeBg}; padding: 4px 10px; border-radius: 12px; display: flex; align-items: center; gap: 4px;">
                    <i class="icon f7-icons size-13">${isSelesai ? "checkmark_seal_fill" : "xmark_seal_fill"}</i> ${item.status}
                  </div>
                </div>
                <div style="font-size: 15px; font-weight: 700; color: #1B365D; margin-bottom: 4px;">${item.nama || "Tanpa Nama"}</div>
                <div style="font-size: 12px; font-weight: 600; color: #005A9C; margin-bottom: 12px;">Diselesaikan: ${new Date(item.tgl_tindakan || item.tanggal).toLocaleDateString("id-ID")}</div>
                <div style="background: #F3F8FB; padding: 10px 12px; border-radius: 12px; border-left: 3.5px solid ${colorTheme};">
                  <span style="font-size: 11px; font-weight: 700; color: #5A7188; display: block; margin-bottom: 2px;">Catatan Penanganan:</span>
                  <span style="font-size: 13px; color: #1B365D; font-style: italic;">"${item.catatan_penanganan || "Tidak ada catatan."}"</span>
                </div>
              </div>
            </div>`;
        })
        .join("");
    };

    const bukaFormPenanganan = (id_laporan) => {
      const dataItem = daftarTugasSemua.find((x) => String(x.id) === String(id_laporan));
      if (dataItem) {
        localStorage.setItem("laporan_aktif", JSON.stringify(dataItem));
        $f7.views.main.router.navigate("/penanganan/");
      }
    };

    return $render;
  };
</script>
